name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        run: echo "${{ secrets.DOCKERHUB_PASS }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/pokeneas:latest .

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKERHUB_USER }}/pokeneas:latest
